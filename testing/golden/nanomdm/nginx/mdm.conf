# mTLS reverse proxy in front of nanomdm's MDM endpoints. The device presents its
# SCEP-issued identity cert; nginx verifies it against the device CA and forwards the
# URL-escaped PEM to nanomdm via the header nanomdm reads with -cert-header. nanomdm's
# API (/v1/*) is NOT exposed here — it stays on a host-local port (see compose.yaml).
server {
    listen 9000 ssl;
    server_name idp.test;

    ssl_certificate     /etc/nginx/certs/mdm-server.crt;
    ssl_certificate_key /etc/nginx/certs/mdm-server.key;

    # Require a client cert issued by the device CA (SCEP CA) for all MDM traffic.
    ssl_client_certificate /etc/nginx/certs/device-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location / {
        proxy_pass http://nanomdm:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
    }
}
